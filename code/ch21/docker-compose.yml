# illustrative config - adapt versions, paths and GPU settings
# vLLM (OpenAI-compatible) behind an nginx reverse proxy with TLS + API keys.
services:
  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:?pin an exact tested tag}
    command:
      - --model=/models/examplelm-8b-instruct      # local path, never a hub id
      - --served-model-name=assistant-8b
      - --max-model-len=16384
      - --gpu-memory-utilization=0.90
      - --max-num-seqs=32
      - --enable-lora
      - --lora-modules=quote-style=/adapters/quote-style-v3
      - --enable-auto-tool-choice
      - --tool-call-parser=${TOOL_PARSER:?see vLLM docs for your model family}
    environment:
      HF_HUB_OFFLINE: "1"            # never try to download anything
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"       # disable usage statistics reporting
      DO_NOT_TRACK: "1"
    volumes:
      - /srv/models:/models:ro       # read-only, verified by manifest
      - /srv/adapters:/adapters:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [llm_internal]         # NOT published to the host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s             # loading weights takes time
    restart: unless-stopped

  gateway:
    image: nginx:${NGINX_TAG:?pin an exact tested tag}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/tls:/etc/nginx/tls:ro
    ports: ["10.0.0.5:8443:8443"]    # internal interface only (example IP)
    depends_on: [vllm]
    networks: [llm_internal]
    restart: unless-stopped

networks:
  llm_internal:
    internal: true          # no route to the internet from this network
