# illustrative config - API-key check + TLS in front of vLLM
events {}
http {
  map $http_authorization $client_name {     # one key per calling service
    default                    "";
    "Bearer CHANGE_ME_ORCH"    "orchestrator";
    "Bearer CHANGE_ME_EVAL"    "eval-runner";
  }
  log_format llm '$time_iso8601 client=$client_name status=$status '
                 'rt=$request_time bytes=$body_bytes_sent';   # no bodies!
  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    access_log /var/log/nginx/llm.log llm;
    client_max_body_size 2m;
    location = /health { proxy_pass http://vllm:8000/health; }
    location /v1/ {
      if ($client_name = "") { return 401; }
      proxy_set_header Authorization "";       # do not forward client keys
      proxy_read_timeout 300s;
      proxy_buffering off;                     # needed for streaming
      proxy_pass http://vllm:8000;
    }
    location / { return 404; }               # /metrics only from monitoring net
  }
}
